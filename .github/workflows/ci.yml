name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # RCF referees over the repo's own tree: schema/reference integrity,
      # then per-AC strict coverage (every AC bound to a TC whose
      # testPointer resolves to a real test). A stub TC or a new
      # uncovered AC fails the build here.
      - run: node bin/rcf.js validate
        working-directory: packages/rcf-lite
      - run: node bin/rcf.js coverage --strict
        working-directory: packages/rcf-lite
      - run: pnpm -r test
