name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # RCF referees over the repo's own tree: schema/reference integrity,
      # then per-AC strict coverage (every AC bound to a TC whose
      # testPointer resolves to a real test). A stub TC or a new
      # uncovered AC fails the build here.
      - run: node bin/rcf.js define validate
        working-directory: packages/rcf-lite
      - run: node bin/rcf.js audit coverage --strict
        working-directory: packages/rcf-lite
      # Customer-register scan over the shipped shelf. Refuses any hit
      # for internal operator names, workflow ids, internal host names,
      # em-dashes, and internal train / hardening labels in shipped
      # blueprint content.
      - run: node scripts/run-register-scan.mjs
        working-directory: packages/rcf-lite
      # Blueprint chain-consistency gate. Runs the single-definition
      # ownership and REQ-delivery lint over every shipped blueprint
      # under the authoritative shelf at the monorepo root
      # (`blueprints/`). CI forces the root shelf via
      # `RCF_LINT_SHELF: root` so a local staged copy under
      # `packages/rcf-lite/blueprints/` never shadows the sources.
      # HARD mode: any unsuppressed finding fails the build. A legacy
      # finding must ship under a documented suppression in the
      # blueprint's README ("Known chain-consistency-lint
      # suppressions"); pass-2 findings are never suppressible.
      - run: node scripts/run-consistency-lint.mjs
        working-directory: packages/rcf-lite
        env:
          RCF_LINT_SHELF: root
          RCF_LINT_MODE: hard
      - run: pnpm -r test
