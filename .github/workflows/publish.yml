name: publish
# Tag-driven publishing for the rcf-lite umbrella (post 0.7.1 packaging
# consolidation). The suite ships as ONE npm package (`rcf-lite`,
# lockstep-versioned) so there is exactly one publish route:
#
#   rcf-lite-v<version>  ->  packages/rcf-lite  (`rcf-lite`)
#
# The trusted-publisher (OIDC) binding is repo + workflow FILENAME (this
# file). The Baz-owned re-registration under the new package name is
# tracked in docs/2026-08-06_packaging-registry-runbook.md step 4;
# nothing in this workflow executes registry admin.
#
# Legacy build-v* / verify-v* / core-v* tag routes are dropped: the
# @stravica-ai/rcf-build-lite / rcf-verify-lite / rcf-lite-core packages
# are DEPRECATED (never unpublished) via the runbook after the umbrella
# publish. If a legacy patch is ever needed, it lands off a maintenance
# branch and uses a temporary re-added tag route per the runbook's
# rollback section.
on:
  push:
    tags:
      - 'rcf-lite-v*'
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      # Register-regression canary (Track D §7). INFORMATIONAL ONLY, NEVER A
      # RELEASE GATE. The canary infrastructure runs against the MOCK subagent
      # driver in v1: MOCK_DRIVER_MARKER stamps every record and the aggregate
      # verdict is FORCED to `fail` per the mock-driver honesty contract, so a
      # non-zero exit here is expected. `continue-on-error: true` makes this
      # a machinery-exercise pass: it proves the canary script runs green-path
      # in the release environment, nothing more. The gate turns on only when
      # the live subagent driver (RCF_CANARY_DRIVER seam, Anthropic Agent SDK
      # dispatch) ships as a separate follow-up. Do NOT remove
      # `continue-on-error` before then.
      - name: Register-regression canary (mock driver, informational)
        continue-on-error: true
        working-directory: packages/rcf-lite
        run: |
          echo "informational: mock-driver canary; MOCK_DRIVER_MARKER stamps every record; NOT a release gate"
          npm run canary:register || echo "canary exit non-zero (expected in mock mode); continuing"
      - name: Resolve umbrella version from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            rcf-lite-v*) DIR="packages/rcf-lite"; NAME="rcf-lite"; VERSION="${TAG#rcf-lite-v}" ;;
            *) echo "::error::Unrecognised release tag '$TAG' — expected rcf-lite-v*"; exit 1 ;;
          esac
          # Guard: the package.json version MUST equal the tag's version. A wrong
          # tag, or a tag pushed without the matching version bump, can never
          # publish. This is the hard "wrong tag never publishes" backstop.
          PKG_VERSION="$(node -p "require('./$DIR/package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag version '$VERSION' does not match $DIR/package.json version '$PKG_VERSION'"; exit 1
          fi
          # Prerelease detection runs on VERSION (the post-prefix part), never the
          # raw tag — the tag always contains a '-' inside its '<name>-v' prefix.
          # A '-' in the version (e.g. 0.7.1-rc.0) -> 'prerelease' dist-tag so a
          # prerelease can never clobber 'latest'; a plain version -> 'latest'.
          case "$VERSION" in
            *-*) DIST="prerelease" ;;
            *)   DIST="latest" ;;
          esac
          {
            echo "dir=$DIR"
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "dist=$DIST"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $NAME@$VERSION from $DIR -> dist-tag '$DIST'"
      # Publish via `pnpm publish`. Post-consolidation the umbrella has no
      # `workspace:*` runtime deps (core is inlined at src/core/ and reached
      # through the `#core/*` subpath-imports alias), but pnpm publish still
      # gives us `--provenance` and `--access public`. `--no-git-checks`
      # because a tag build is a detached HEAD.
      - name: Publish package
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          if [ "${{ steps.pkg.outputs.dist }}" = "prerelease" ]; then
            echo "Prerelease version (${{ steps.pkg.outputs.version }}) -> publishing under dist-tag 'prerelease'"
            pnpm publish --provenance --access public --tag prerelease --no-git-checks
          else
            echo "Release version (${{ steps.pkg.outputs.version }}) -> publishing under default dist-tag 'latest'"
            pnpm publish --provenance --access public --no-git-checks
          fi
