<!doctype html>
<html lang="en">
<head><title>Service status</title></head>
<body>
  <main>
    <section class="notices" data-testid="notices-region" data-empty-state="true">
      <p class="notices-empty">No active notices.</p>
    </section>
    <section class="components" data-testid="components-region">
      <article class="component" data-name="payments" data-state="operational">
        <h3 class="component-name">Payments</h3>
      </article>
      <article class="component" data-name="notifications" data-state="operational">
        <h3 class="component-name">Notifications</h3>
      </article>
      <article class="component" data-name="data" data-state="operational">
        <h3 class="component-name">Data</h3>
      </article>
    </section>
  </main>
</body>
</html>
