# cf-platform shared sample-app fixture for the deploy-cloudflare-workers
# v1.2.0 Workers-with-static-assets shape (Cloudflare round 6 spec
# section 3.3). The fixture is the T-0 target for the assets-manifest
# scan probe and the shared canvas for T-1 KV, T-2 cron, T-3 DO and
# T-5's Turnstile sub-fixture.

name = "cf-platform"
main = "src/index.mjs"
compatibility_date = "2026-09-06"

[assets]
directory = "./dist"
run_worker_first = true

# Cloudflare round 6 T-1 KV namespace binding for platform-cloudflare-kv.
# The binding name is elicited (fixture default is CACHE); the id and
# preview_id are placeholders for the fixture and are wired to real
# namespace ids in a project via wrangler kv namespace create at apply
# time. The facade module (src/kv-facade.mjs) is the sole reader of
# env.CACHE per REQ-001.
[[kv_namespaces]]
binding = "CACHE"
id = "cf_platform_fixture_cache_id_placeholder"
preview_id = "cf_platform_fixture_cache_preview_placeholder"

# Cloudflare round 6 T-2 Cron Triggers for platform-cloudflare-cron-triggers.
# Two expressions declared to exercise the expression-router dispatcher: the
# minute cadence drives the wrangler-test-scheduled probe against src/scheduled.mjs;
# the five-minute cadence is a distinct route the dispatcher-routing probe drives
# in-process (never scheduled by wrangler dev). The elicited answer written into
# an applied project's wrangler.toml is the operator's own list; the fixture
# defaults are the multi-cron shape the dispatcher was built for.
[triggers]
crons = ["* * * * *", "*/5 * * * *"]

# Cloudflare round 6 T-3 Durable Objects bindings for
# platform-cloudflare-durable-objects. The single-cell binding
# CELL exposes the SingleCellObject class (src/do-single-cell.mjs);
# the hub binding HUB exposes the HubObject class (src/do-hub.mjs).
# The facade module (src/do-facade.mjs) is the sole reader of
# env.CELL and env.HUB per REQ-070 (sole-reader guarantee) and
# REQ-076 (AST-scan enforcement). Class names are stable strings
# per REQ-077 and are committed to the migrations block below so a
# future rename lands as a wrangler migration rather than a silent
# rewire.
[[durable_objects.bindings]]
name = "CELL"
class_name = "SingleCellObject"

[[durable_objects.bindings]]
name = "HUB"
class_name = "HubObject"

# T-3 migrations block per REQ-077. The class names are the stable
# strings committed with the v1.0.0 mint; the tag is the migration
# id (a v1 mint under tag "v1"). A rename or a deprecation lands
# as a subsequent tag entry in the same list.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SingleCellObject", "HubObject"]
