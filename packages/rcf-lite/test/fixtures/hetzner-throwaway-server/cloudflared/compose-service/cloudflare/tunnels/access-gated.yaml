# Round-7 T-3 fixture tunnel manifest: compose-service runtime, access-gated mode.
#
# When edge-cloudflare-access v1.0.0 is applied (zeroTrustGate on
# appliedCapabilities), every ingress rule attaches an originRequest.access
# block naming the Access AUD per ADR-4003. cloudflared refuses at the
# edge any request without a valid Access JWT for the named AUD.
tunnel: 00000000-0000-4000-8000-000000000c02
credentialsFile:
  secretRef: hq-estate/CLOUDFLARE_TUNNEL_CREDENTIALS_T3_COMPOSE
ingress:
  - hostname: probe.compose.rcf-lite-ci.example
    service: http://web:8080
    originRequest:
      access:
        aud: AUD-fixture-rcf-lite-ci-throwaway
        teamName: rcf-lite-ci
        required: true
  - service: http_status:404
