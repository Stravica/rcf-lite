services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rcf-dev
      MINIO_ROOT_PASSWORD: rcf-dev-only
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 rcf-dev rcf-dev-only && mc ready local || curl -f http://localhost:9000/minio/health/live || wget -q -O- http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
