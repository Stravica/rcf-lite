# rcf-lite release feed source of truth.
#
# This file is the single source that the docs site (stravica.ai) reads
# at build time to publish the machine-readable feed at
#   https://stravica.ai/docs/rcf/releases.json
# and that the rcf-lite package's prepublishOnly step validates against
# `package.json:version` so a release cannot ship without its own entry.
#
# Contract lives in
#   projects/rcf-lite-wsd/specs/update-awareness-spec-2026-08-28.md
# section 1 (ratified 2026-08-30).
#
# Editing rules at release time:
#   1. Add the new release as the top entry under `releases:` (newest
#      first).
#   2. Update `latest:` to match the new top entry's `version`.
#   3. Keep `headlines[]` operator-facing: one to three sentences, plain
#      language, sentence case, terminal period, no method vocabulary
#      shortcuts.
#   4. Set `breaking: true` only when the release is a semver-breaking
#      change per the pre-1.0 breaking-is-minor convention (see
#      CHANGELOG.md preamble).
#   5. `minAgentAction` names the extra work the agent needs to do beyond
#      running the install command. `null` means no extra action. The
#      enumerated values are listed in the spec section 1.5:
#        - rewrite-shell-invocations
#        - rerun-init
#        - regenerate-chain
#        - schema-migration
#   6. `notesUrl` is optional. It currently points at the top of the
#      human changelog; per-release deep links are a follow-up once the
#      docs pipeline gives /docs/ headings stable anchor ids.
#   7. Do not delete or rewrite historical entries; the feed is append-only.
#
# Every published release under the `rcf-lite` npm name is listed here.
# The pre-rename history (packages published under
# `@stravica-ai/rcf-build-lite`, `@stravica-ai/rcf-lite-core`, and
# `@stravica-ai/rcf-verify-lite`) lives in CHANGELOG.md but is not part of
# this feed; the feed is scoped to what an operator can install today as
# `npm install rcf-lite`.

feedVersion: 1
latest: "0.21.0"
releases:
  - version: "0.21.0"
    date: "2026-09-05"
    breaking: false
    headlines:
      - "rcf-lite 0.21.0 adds five visual-feature blueprints to the shelf (data table, charts, dashboard with packaged design guidance, in-app notifications, admin console) and the mechanism that proves them: a blueprint can now ship a Playwright probe pack that rcf verify runs against your running app in a real browser, and the ship gate refuses while a surface check fails."
      - "The admin console only offers the surfaces your applied auth blueprint can support. Blueprints can now ask you questions at apply time."
      - "The schema floor moves to rcf-schemas 0.6.1."
    minAgentAction: null
    notesUrl: "https://stravica.ai/docs/rcf/changelog/"

  - version: "0.20.0"
    date: "2026-09-04"
    breaking: true
    headlines:
      - "rcf-lite 0.20.0 adds an optional evaluation step to the chain for the acceptance criteria whose outcome cannot be checked deterministically. You mark such a criterion when you define it, attach an evaluation with its own pass threshold, and the audit, verify and finalise steps refuse to ship while it is missing, with an explicit opt-out that records its reason."
      - "The schema floor moves to rcf-schemas 0.6.0."
    minAgentAction: "rerun-init"
    notesUrl: "https://stravica.ai/docs/rcf/changelog/"

  - version: "0.19.0"
    date: "2026-09-04"
    breaking: false
    headlines:
      - "The rcf-lite core shelf gains two new blueprints, observability-logging and application-error-handling, that carry the widely followed rules for structured logging and internal error handling so a service can compose them alongside its own blueprint."
      - "Service blueprints can now name the roles they want alongside them and rcf define blueprint suggests the most specific provider for each at apply time, preferring an applied provider first, then a project-level pin, then a registered library, then the shipped shelf; the operator still applies each companion by hand."
      - "The authoring standard grows a written discipline for blueprints that derive from an outside standard, so a must-clause that binds a testable behaviour becomes a test and a choice-shaped clause becomes a recommended default. Rerun rcf init to refresh the agent-instructions block."
    minAgentAction: "rerun-init"
    notesUrl: "https://stravica.ai/docs/rcf/changelog/"

  - version: "0.18.0"
    date: "2026-09-04"
    breaking: true
    headlines:
      - "The rcf-lite blueprint shelf now names a single owner for probe paths across the observability, API and Kubernetes surfaces, so a project that composes more than one of these blueprints no longer has to reconcile duplicate claims by hand."
      - "observability-essentials v2.0.0 and application-api-rest v2.0.0 drop their shipped literal /healthz and /readyz path defaults and defer to the resolved path set from observability-probe-endpoints v1.1.0, which also adds an optional Kubernetes /startup path (off by default, on per project via probeInterface.options.kubernetes.startup.enabled)."
      - "rcf doctor grows a probe-path-owner check that flags a project applying more than one blueprint on the probe-path topic; rcf define blueprint remove-resolution <adr-id> is the paired remedy verb that drops a single manifest resolutions entry. Migration: a project on essentials v1.x alone needs one probeInterface.paths line per environment on re-apply unless it also composes probe-endpoints v1.1.0 or later; a project that applied both essentials v1.x and probe-endpoints v1.0.0 with a superseding project-level ADR will see the new doctor check flag those resolutions as redundant with the remove-resolution verb as the hint."
    minAgentAction: null
    notesUrl: "https://stravica.ai/docs/rcf/changelog/"

  - version: "0.17.0"
    date: "2026-09-04"
    breaking: false
    headlines:
      - "rcf verify now pins the Playwright MCP browser tooling to a specific version, prints the effective pin on preflight and lands it on the run report, and takes a one-run override for emergency use."
      - "rcf doctor grows four checks for browser-facing projects (Playwright installed, a browser available, the Playwright MCP reachable, and no shadowed duplicate entry), routed by an applied blueprint declaring a browser surface; API-only projects see one skip line."
      - "rcf init writes a Playwright MCP entry only when no scope-visible one exists; when it cannot prove absence it writes a distinctly named playwright-rcf project-scope entry, and --no-playwright-mcp opts out entirely. application-spa v1.4.0 and delivery-ci-workflows v2.2.0 ship the paired browser stories and the illustrative e2e job as a documentation contract."
    minAgentAction: null
    notesUrl: "https://stravica.ai/docs/rcf/changelog/"

  - version: "0.16.0"
    date: "2026-09-03"
    breaking: false
    headlines:
      - "External blueprint libraries now support git and tarball sources with an on-disk cache checked into the tree, plus a refresh command that re-resolves a library's pinned reference and refuses the update on drift."
      - "Adding a blueprint from a local path inside an unregistered library now stamps the same slug and identity a registered add would, closing the author-and-test-locally loop."
      - "The managed agent-instructions block now teaches the agent to offer blueprints and registered libraries in plain words so the operator picks; a new library authoring standard doc and worked-example fixture ship with the package. Rerun rcf init to refresh the block."
    minAgentAction: "rerun-init"
    notesUrl: "https://stravica.ai/docs/rcf/changelog/"

  - version: "0.15.0"
    date: "2026-08-31"
    breaking: false
    headlines:
      - "Library-applied blueprints now carry a durable ownership stamp so re-registering a library under a different prefix no longer orphans records that came from it."
      - "The review-on-add card gained a global-topics section and a prefix-check line so a library's cross-topic surface is visible before the operator commits."
      - "The delivery-ci-workflows blueprint gained optional package-manager and branch-name shape fields, taught the coverage-strict bootstrap trap in the guide, and shipped a starting-point supersession ADR."
    minAgentAction: null
    notesUrl: "https://stravica.ai/docs/rcf/changelog/"

  - version: "0.14.0"
    date: "2026-08-31"
    breaking: true
    headlines:
      - "The ci-pipeline blueprint is renamed to delivery-ci-workflows and gains a broader set of CI workflows and optional checks."
      - "A new rcf version command reports the installed version, with --check comparing against the release feed."
      - "Rerun rcf init to refresh the agent guidance block with the new session-start freshness check."
    minAgentAction: "rerun-init"
    notesUrl: "https://stravica.ai/docs/rcf/changelog/"

  - version: "0.13.0"
    date: "2026-08-31"
    breaking: false
    headlines:
      - "The 14 first-party blueprints now ship inside the installed package, so any doc pointing at a blueprint slug works on a fresh install."
      - "rcf define blueprint add resolves bare slugs and @stock slugs against the packaged shelf, matching how the docs write the commands."
      - "Installing on Node earlier than 24 now refuses outright instead of silently resolving an old placeholder release."
    minAgentAction: null
    notesUrl: "https://stravica.ai/docs/rcf/changelog/"

  - version: "0.12.0"
    date: "2026-08-28"
    breaking: true
    headlines:
      - "Tests that claim to pass or fail must now point at a real test file, enforced by the shared schema."
      - "Tests marked pending or skipped no longer need a pointer, matching how in-progress coverage really looks."
    minAgentAction: "schema-migration"
    notesUrl: "https://stravica.ai/docs/rcf/changelog/"

  - version: "0.11.0"
    date: "2026-08-27"
    breaking: false
    headlines:
      - "The shipped agent guidance gained three new rules for how the agent drives the method loop."
      - "Re-run rcf init to refresh the managed block in your project's agent instructions file."
    minAgentAction: "rerun-init"
    notesUrl: "https://stravica.ai/docs/rcf/changelog/"

  - version: "0.10.0"
    date: "2026-08-26"
    breaking: true
    headlines:
      - "The command-line interface is reorganised: every command now sits under one of five groups."
      - "Old flat command forms fail with a message that names the new form."
    minAgentAction: "rewrite-shell-invocations"
    notesUrl: "https://stravica.ai/docs/rcf/changelog/"

  - version: "0.9.0"
    date: "2026-08-25"
    breaking: false
    headlines:
      - "Blueprints landed: compose pre-built implementation patterns onto your project instead of inventing them from a blank page."
      - "Six starter blueprints ship in the same release, covering web app, REST API, auth, persistence, CI pipeline and observability."
    minAgentAction: null
    notesUrl: "https://stravica.ai/docs/rcf/changelog/"

  - version: "0.8.0"
    date: "2026-08-12"
    breaking: false
    headlines:
      - "A shared standards ruleset ships bundled with the package and now feeds refuse-first admissibility checks on the chain."
      - "The verifier catches a subtle dishonesty: a test that is narrower in scope than the check it claims to prove."
    minAgentAction: null
    notesUrl: "https://stravica.ai/docs/rcf/changelog/"

  - version: "0.7.1"
    date: "2026-08-12"
    breaking: false
    headlines:
